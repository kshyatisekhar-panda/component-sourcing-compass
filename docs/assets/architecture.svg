<svg width="900" height="370" viewBox="0 0 900 370" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <clipPath id="clip-client"><rect x="30" y="30" width="200" height="320" rx="10"/></clipPath>
    <clipPath id="clip-server"><rect x="290" y="30" width="300" height="320" rx="10"/></clipPath>
    <clipPath id="clip-data"><rect x="670" y="80" width="200" height="220" rx="10"/></clipPath>
  </defs>

  <!-- ============== Client card (Cline — equal partner with the server) ============== -->
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="200" height="320" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  </g>
  <g clip-path="url(#clip-client)">
    <rect x="30" y="30" width="200" height="4" fill="#06b6d4"/>
  </g>
  <text x="50" y="65" font-size="14" font-weight="600" fill="#0f172a" letter-spacing="0.2">Cline</text>
  <text x="50" y="82" font-size="11" fill="#64748b" font-style="italic">MCP client · VS Code</text>
  <line x1="50" y1="98" x2="210" y2="98" stroke="#f1f5f9" stroke-width="1"/>

  <text x="50" y="120" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1.5">LLM</text>
  <text x="50" y="146" font-size="13" fill="#0f172a" font-weight="500">Claude Sonnet 4.5</text>
  <text x="50" y="164" font-size="11" fill="#64748b" font-style="italic">via OpenRouter</text>

  <line x1="50" y1="210" x2="210" y2="210" stroke="#f1f5f9" stroke-width="1"/>
  <text x="50" y="232" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1.5">ALSO WORKS WITH</text>
  <text x="50" y="258" font-size="12" fill="#475569">Claude Desktop</text>
  <text x="50" y="278" font-size="12" fill="#475569">ChatGPT desktop</text>
  <text x="50" y="298" font-size="12" fill="#475569">custom MCP hosts</text>
  <text x="50" y="324" font-size="10" fill="#94a3b8" font-style="italic">no client lock-in</text>

  <!-- ============== Server card (this repo) ============== -->
  <g filter="url(#shadow)">
    <rect x="290" y="30" width="300" height="320" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  </g>
  <g clip-path="url(#clip-server)">
    <rect x="290" y="30" width="300" height="4" fill="#6366f1"/>
  </g>
  <text x="310" y="65" font-size="14" font-weight="600" fill="#0f172a" letter-spacing="0.2">MCP Server</text>
  <text x="310" y="82" font-size="11" fill="#64748b" font-style="italic">this repo · TypeScript</text>
  <line x1="310" y1="98" x2="570" y2="98" stroke="#f1f5f9" stroke-width="1"/>

  <text x="310" y="120" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1.5">TOOLS</text>

  <!-- list_components -->
  <circle cx="318" cy="142" r="4.5" fill="#10b981"/>
  <path d="M315.5,142 L317.5,144 L320.5,140.5" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="332" y="146" font-size="13" fill="#0f172a" font-weight="500">list_components</text>

  <!-- cost_ranked_list -->
  <circle cx="318" cy="172" r="4.5" fill="#10b981"/>
  <path d="M315.5,172 L317.5,174 L320.5,170.5" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="332" y="176" font-size="13" fill="#0f172a" font-weight="500">cost_ranked_list</text>

  <!-- get_price_history -->
  <circle cx="318" cy="202" r="4.5" fill="#10b981"/>
  <path d="M315.5,202 L317.5,204 L320.5,200.5" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="332" y="206" font-size="13" fill="#0f172a" font-weight="500">get_price_history</text>

  <!-- compare_with_mouser -->
  <circle cx="318" cy="232" r="4.5" fill="#10b981"/>
  <path d="M315.5,232 L317.5,234 L320.5,230.5" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="332" y="236" font-size="13" fill="#0f172a" font-weight="500">compare_with_mouser</text>

  <!-- cross_product_suggestions -->
  <circle cx="318" cy="262" r="4.5" fill="#10b981"/>
  <path d="M315.5,262 L317.5,264 L320.5,260.5" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="332" y="266" font-size="13" fill="#0f172a" font-weight="500">cross_product_suggestions</text>

  <!-- compliance_check -->
  <circle cx="318" cy="292" r="4.5" fill="#10b981"/>
  <path d="M315.5,292 L317.5,294 L320.5,290.5" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="332" y="296" font-size="13" fill="#0f172a" font-weight="500">compliance_check</text>

  <!-- stretch footer -->
  <line x1="310" y1="316" x2="570" y2="316" stroke="#f1f5f9" stroke-width="1"/>
  <text x="318" y="333" font-size="10" fill="#94a3b8" font-style="italic">stretch: taric_lookup, assurance docs</text>

  <!-- ============== Data card ============== -->
  <g filter="url(#shadow)">
    <rect x="670" y="80" width="200" height="220" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  </g>
  <g clip-path="url(#clip-data)">
    <rect x="670" y="80" width="200" height="4" fill="#f97316"/>
  </g>
  <text x="690" y="115" font-size="14" font-weight="600" fill="#0f172a" letter-spacing="0.2">Data layer</text>
  <text x="690" y="132" font-size="11" fill="#64748b" font-style="italic">JSON fixtures · PoC scope</text>
  <line x1="690" y1="148" x2="850" y2="148" stroke="#f1f5f9" stroke-width="1"/>
  <text x="690" y="174" font-size="13" fill="#1e293b" font-weight="500">BOM</text>
  <text x="690" y="196" font-size="13" fill="#475569">price history</text>
  <text x="690" y="218" font-size="13" fill="#475569">Mouser snapshots</text>
  <text x="690" y="240" font-size="13" fill="#475569">compliance rules</text>
  <text x="690" y="275" font-size="11" fill="#94a3b8" font-style="italic">production: real DB,</text>
  <text x="690" y="288" font-size="11" fill="#94a3b8" font-style="italic">supplier APIs, EU TARIC</text>

  <!-- ============== Connections ============== -->
  <!-- Client <-> Server -->
  <line x1="232" y1="190" x2="288" y2="190" stroke="#64748b" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="260" y="178" text-anchor="middle" font-size="10" fill="#475569" font-weight="500">JSON-RPC</text>
  <text x="260" y="206" text-anchor="middle" font-size="10" fill="#94a3b8">over stdio</text>

  <!-- Server -> Data -->
  <line x1="592" y1="190" x2="668" y2="190" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="630" y="180" text-anchor="middle" font-size="10" fill="#475569" font-weight="500">reads</text>
</svg>
